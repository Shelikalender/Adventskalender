<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Adventskalender</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #315f4b;
    }

    body {
      overflow-x: hidden;
    }

    .container-wrapper-genially {
      position: relative;
      width: 100%;
      min-height: 100vh;
      max-width: 100%;
      margin: 0;
      padding: 0;
    }

    .genially-embed {
      margin: 0 auto;
      position: relative;
      width: 100%;
      height: auto;
    }

    .loader-genially {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      z-index: 1;
    }
  </style>
</head>

<body>

  <div class="container-wrapper-genially">

    <video
      class="loader-genially"
      autoplay
      loop
      playsinline
      muted>

      <source
        src="https://static.genially.com/resources/loader-default-rebranding.mp4"
        type="video/mp4">

    </video>

    <div
      id="6a8c092ea417b92cd864e45f"
      class="genially-embed">
    </div>

  </div>

  <script>
    (function (d) {
      var js,
          id = "genially-embed-js",
          ref = d.getElementsByTagName("script")[0];

      if (d.getElementById(id)) {
        return;
      }

      js = d.createElement("script");
      js.id = id;
      js.async = true;
      js.src = "https://view.genially.com/static/embed/embed.js";

      ref.parentNode.insertBefore(js, ref);
    }(document));
  </script>

</body>
</html>
