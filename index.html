<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adventskalender</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #315f4b;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .calendar-wrapper {
      position: relative;

      /* Originalformat: 360 x 1200 */
      aspect-ratio: 360 / 1200;

      /* So groß wie möglich, ohne abgeschnitten zu werden */
      height: 100vh;
      max-width: 100vw;

      overflow: hidden;
    }

    .calendar-wrapper iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .controls-cover {
      position: absolute;

      /* Feinjustierung hier möglich */
      right: 0;
      bottom: 0;

      /* Größe relativ zur 360px breiten Originalseite */
      width: 24%;
      height: 4.5%;

      background: #315f4b;
      z-index: 9999;
      pointer-events: auto;
    }
  </style>
</head>

<body>

  <div class="calendar-wrapper">

    <iframe
      src="https://view.genially.com/6a8c092ea417b92cd864e45f"
      title="Adventskalender"
      scrolling="yes">
    </iframe>

    <div class="controls-cover"></div>

  </div>

</body>
</html>
